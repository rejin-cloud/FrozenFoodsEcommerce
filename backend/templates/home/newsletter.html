<section class="py-5 bg-white border-top">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <i class="bi bi-envelope-paper text-success fs-1 mb-2 d-inline-block"></i>
                <h2 class="fw-bold mt-2">
                    Stay Freshly Updated
                </h2>
                <p class="text-muted">
                    Get weekly recipes, flash deal notifications, and exclusive subscriber perks.
                </p>

                <form class="newsletter-input-group mt-4" onsubmit="event.preventDefault(); alert('Thank you for subscribing!');">
                    <input
                        type="email"
                        class="form-control newsletter-field"
                        placeholder="Enter your email address"
                        required
                    >
                    <button
                        type="submit"
                        class="btn btn-primary-fresh px-4"
                    >
                        Subscribe
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
