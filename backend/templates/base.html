{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meame.in | Premium Frozen Foods & Meats Delivered Fresh</title>
    
    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon.png' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    
    <!-- Theme Instant Initialization (Zero-FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('meame_theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts Preconnect & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.3">
    <link rel="stylesheet" href="{% static 'css/home.css' %}?v=2.3">
</head>

<body>

    <!-- Header Navigation -->
    {% include 'includes/navbar.html' %}

    <!-- Global On-Screen Toast Container -->
    <div id="globalToastContainer" class="toast-container-global" aria-live="polite" aria-atomic="true"></div>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap 5.3.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global Toast Notification Engine -->
    <script>
        function showToast(message, type = 'success', duration = 3800) {
            let container = document.getElementById('globalToastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'globalToastContainer';
                container.className = 'toast-container-global';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            const toastType = (type === 'danger' || type === 'error') ? 'error' : (type === 'warning' ? 'warning' : (type === 'info' ? 'info' : 'success'));
            toast.className = `custom-toast-pill toast-${toastType}`;

            let icon = 'bi-check2-circle';
            let title = 'Success';
            if (toastType === 'warning') {
                icon = 'bi-exclamation-triangle-fill';
                title = 'Notice';
            } else if (toastType === 'error') {
                icon = 'bi-x-circle-fill';
                title = 'Error';
            } else if (toastType === 'info') {
                icon = 'bi-info-circle-fill';
                title = 'Info';
            }

            toast.innerHTML = `
                <div class="toast-icon-wrap">
                    <i class="bi ${icon}"></i>
                </div>
                <div class="toast-content-wrap">
                    <div class="toast-title-text">${title}</div>
                    <div class="toast-msg-text">${message}</div>
                </div>
                <button class="toast-btn-close" type="button" aria-label="Close">&times;</button>
                <div class="toast-progress-bar" style="animation-duration: ${duration}ms;"></div>
            `;

            container.appendChild(toast);

            let isRemoved = false;
            function removeToast() {
                if (isRemoved) return;
                isRemoved = true;
                toast.classList.add('toast-hiding');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }

            toast.querySelector('.toast-btn-close').addEventListener('click', removeToast);
            setTimeout(removeToast, duration);
        }

        // Safe global override to intercept any browser alert() popup into a beautiful on-screen toast
        window.alert = function(msg) {
            showToast(msg, 'info', 4000);
        };

        // Global Theme Switcher Engine
        function applyTheme(theme, save = true) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            if (document.body) {
                document.body.setAttribute('data-bs-theme', theme);
            }
            if (save) {
                localStorage.setItem('meame_theme', theme);
            }
            
            // Update aria labels & tooltips on toggle buttons
            const toggleButtons = document.querySelectorAll('.theme-toggle-btn');
            toggleButtons.forEach(btn => {
                const label = theme === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);
            });

            // Update mobile drawer text if exists
            const mobileLabel = document.getElementById('mobileThemeLabelText');
            if (mobileLabel) {
                mobileLabel.textContent = theme === 'dark' ? 'Dark Mode' : 'Light Mode';
            }

            window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme } }));
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme, true);
            showToast(newTheme === 'dark' ? 'Switched to Dark Theme' : 'Switched to Light Theme', 'info', 2200);
        }

        // Initialize Theme & Listeners on Page Load
        document.addEventListener('DOMContentLoaded', function() {
            const currentTheme = localStorage.getItem('meame_theme') || 'dark';
            applyTheme(currentTheme, false);

            {% if messages %}
                {% for message in messages %}
                    showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}");
                {% endfor %}
            {% endif %}

            // Flash Deal Countdown Timer (Simulated local countdown)
            const countdownEl = document.getElementById('flashDealTimer');
            if (countdownEl) {
                let endOfDay = new Date();
                endOfDay.setHours(23, 59, 59, 999);
                
                function updateTimer() {
                    const diff = endOfDay - new Date();
                    if (diff <= 0) {
                        countdownEl.textContent = "00:00:00";
                        return;
                    }
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    
                    const format = (n) => n < 10 ? '0' + n : n;
                    countdownEl.textContent = `${format(hours)}h : ${format(minutes)}m : ${format(seconds)}s`;
                }
                updateTimer();
                setInterval(updateTimer, 1000);
            }
        });
    </script>

</body>

</html>
