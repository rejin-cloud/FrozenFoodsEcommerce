{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 shadow-sm border-0">
                <h3 class="fw-bold mb-4 text-center">Create Account</h3>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Register</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="{% url 'accounts:login' %}" class="text-success fw-bold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
