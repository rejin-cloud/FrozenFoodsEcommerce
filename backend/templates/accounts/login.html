{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 shadow-sm border-0">
                <h3 class="fw-bold mb-4 text-center">Login</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="{% url 'accounts:register' %}" class="text-success fw-bold">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
